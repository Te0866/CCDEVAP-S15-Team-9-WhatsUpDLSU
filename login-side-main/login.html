<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WhatsUpDLSU - Login</title>
<link rel="stylesheet" href="../assets/styles/login/style.css">
<link rel="stylesheet" href="../assets/styles/login/modal.css">
    
    </head>
    <body class="s-login-style s-login-modal">
        <div class="page-container">
            <div class="brand-row">
                <img src="./img/WhatUpDLSULogo.png" alt="WhatsUpDLSU Logo" class="brand-logo">
                <h1 class="main-title">WhatsUpDLSU</h1>
            </div>
            <p class="description">
                Stay updated with university events, organization activities,
                workshops, seminars, and campus announcements.
            </p>
            <div class="login-container">
                <h2>User Login</h2>
                <form id="loginForm" action="login.php" method="POST">
                    <div class="input-row">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" required >
                    </div>
                    <div class="input-row">
                        <label for="password">Password:</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" required >
                            <button type="button" id="togglePassword" class="toggle-btn" > Show </button>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn"> SUBMIT </button>
                </form>
            </div>
            <a href="create-account.html" class="register-link"> Sign Up</a>
        </div>

        <!-- Login result modal (matches org-side modal structure) -->
        <div class="app-modal-overlay" id="loginModal">
            <div class="app-modal-box">
                <div class="app-modal-icon" id="modalIcon"></div>
                <div class="app-modal-title" id="modalTitle"></div>
                <div class="app-modal-message" id="modalMessage"></div>
                <div class="app-modal-actions">
                    <button type="button" class="app-modal-btn primary" id="modalOkBtn">OK</button>
                </div>
            </div>
        </div>

<script src="../assets/scripts/login/login.js"></script>
    </body>
</html>
